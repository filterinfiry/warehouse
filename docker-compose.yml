# PostgreSQL para desarrollo local (aislado).
# Puerto host 5433 para NO chocar con el postgres del sistema (5432) ni con SN51.
# Levantar: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse-pgdata:/var/lib/postgresql/data
    labels:
      # Que el watchtower de SN51 no gestione este contenedor.
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  warehouse-pgdata:
